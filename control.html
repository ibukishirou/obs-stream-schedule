<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>V-Schedule Control</title>
	<link rel="stylesheet" href="assets/control.css?v=20261014e">
</head>
<body>
	<header>
		<nav class="tabs" role="tablist" aria-label="表示切り替え">
			<button type="button" class="tab is-on" id="tab-sched" aria-controls="pane-sched" data-tab="sched" role="tab" aria-selected="true">予定</button>
			<button type="button" class="tab" id="tab-conf" aria-controls="pane-conf" data-tab="conf" role="tab" aria-selected="false">設定</button>
		</nav>
		<div class="header-tools">
			<div class="date-nav" role="group" aria-label="表示する日付">
				<button type="button" id="prev" class="headerbtn" aria-label="1日もどる">‹</button>
				<button type="button" id="today" class="headerbtn todaybtn">今日</button>
				<button type="button" id="next" class="headerbtn" aria-label="1日すすむ">›</button>
			</div>
			<div class="day-count" role="group" aria-label="表示日数">
				<button type="button" id="dayDown" class="headerbtn" aria-label="表示日数を減らす">−</button>
				<label class="count-label"><input type="number" id="dayCount" min="1" max="31" step="1" value="7" aria-label="表示日数"><span>日</span></label>
				<button type="button" id="dayUp" class="headerbtn" aria-label="表示日数を増やす">＋</button>
			</div>
		</div>
	</header>

	<!-- ── 予定タブ ─────────────────────────────────────────────── -->
	<section class="tabpane is-on" id="pane-sched" role="tabpanel" aria-labelledby="tab-sched" data-pane="sched">
		<main id="rows"></main>
	</section>

	<!-- ── 設定タブ ─────────────────────────────────────────────── -->
	<section class="tabpane" id="pane-conf" role="tabpanel" aria-labelledby="tab-conf" data-pane="conf">
		<div class="panel">

			<div class="sect">
				<div class="secttl">デザイン</div>

				<div class="field">
					<span class="flabel">テーマ</span>
					<span class="segset" role="group" aria-label="viewテーマ">
						<button type="button" class="seg is-on" data-theme="yoko" aria-pressed="true">横</button>
						<button type="button" class="seg" data-theme="tate" aria-pressed="false">縦</button>
					</span>
				</div>

				<div class="field pair">
					<span class="fgrp">
						<span class="flabel">ベースカラー</span>
						<input type="color" id="viewColor" class="cplate" value="#333333" aria-label="ベースカラー">
					</span>
					<span class="fgrp">
						<span class="flabel">時計文字カラー</span>
						<input type="color" id="clockColor" class="cplate" value="#ffffff" aria-label="時計文字カラー">
					</span>
				</div>

				<div class="field">
					<span class="flabel">不透明度</span>
					<input type="range" id="viewOpacity" min="0" max="100" step="1" value="100" aria-label="文字の不透明度">
					<span class="opval" id="viewOpacityText">100%</span>
				</div>

				<div class="field pair">
					<span class="fgrp">
						<span class="flabel">背景</span>
						<span class="segset" role="group" aria-label="背景の四角">
							<button type="button" class="seg" data-bg="on" aria-pressed="false">ON</button>
							<button type="button" class="seg is-on" data-bg="off" aria-pressed="true">OFF</button>
						</span>
					</span>
					<span class="fgrp">
						<span class="flabel">背景の色</span>
						<input type="color" id="bgFill" class="cplate" value="#ffffff" aria-label="背景の色">
					</span>
				</div>

				<div class="field pair">
					<span class="fgrp">
						<span class="flabel">背景のフチ</span>
						<span class="segset" role="group" aria-label="背景のフチ">
							<button type="button" class="seg is-on" data-bgborder="on" aria-pressed="true">ON</button>
							<button type="button" class="seg" data-bgborder="off" aria-pressed="false">OFF</button>
						</span>
					</span>
					<span class="fgrp">
						<span class="flabel">フチの色</span>
						<input type="color" id="bgBorderColor" class="cplate" value="#333333" aria-label="フチの色">
					</span>
				</div>

				<div class="field">
					<span class="flabel">横幅</span>
					<label class="checklabel"><input type="checkbox" id="autoWidth"> 自動（最長タイトルに合わせる）</label>
				</div>
				<div class="field">
					<label class="flabel" for="titleAlign">タイトル揃え</label>
					<select id="titleAlign"><option value="left">左揃え</option><option value="center">中央揃え</option></select>
				</div>

				<div class="field">
					<span class="flabel">背景の横幅</span>
					<input type="range" id="bgW" min="40" max="110" step="1" value="100" aria-label="背景の横幅">
					<span class="opval" id="bgWText">100%</span>
				</div>

			<div class="field">
				<span class="flabel">背景の縦幅</span>
				<input type="range" id="bgH" min="40" max="110" step="1" value="100" aria-label="背景の縦幅">
				<span class="opval" id="bgHText">100%</span>
			</div>

			<div class="field">
				<span class="flabel">角丸</span>
				<input type="range" id="corner" min="0" max="100" step="1" value="10" aria-label="背景の角丸">
				<span class="opval" id="cornerText">10%</span>
			</div>
			</div>

			<div class="sect">
				<div class="secttl">項目</div>

				<div class="field">
					<span class="flabel">お休みの表示</span>
					<span class="segset" role="group" aria-label="お休みの表示">
						<button type="button" class="seg is-on" data-showoff="on" aria-pressed="true">ON</button>
						<button type="button" class="seg" data-showoff="off" aria-pressed="false">OFF</button>
					</span>
				</div>
			</div>

		</div>
		<footer>
			<button type="button" id="reset" class="resetbtn">すべてリセット</button>
		</footer>
	</section>

	<script src="assets/control.js?v=20261014e"></script>
</body>
</html>
